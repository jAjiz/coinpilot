version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Node majors move by hand, LTS to LTS, together with web/.nvmrc.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
