name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: coinpilot
          POSTGRES_PASSWORD: coinpilot
          POSTGRES_DB: coinpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coinpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://coinpilot:coinpilot@localhost:5432/coinpilot
      RUN_DB_INTEGRATION: "true"
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: Tests
        run: pytest tests --cov-fail-under=80

  web:
    name: Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generated client is current
        run: npm run check:generated

      - name: Build
        run: npm run build

      - name: Build check
        run: npm run check:build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

  image:
    name: Image and deploy script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build
        run: docker build -t ghcr.io/jajiz/coinpilot:ci-1 .

      - name: The application is in the image, and only its build
        run: |
          docker run --rm ghcr.io/jajiz/coinpilot:ci-1 test -f web/dist/index.html
          docker run --rm ghcr.io/jajiz/coinpilot:ci-1 sh -c 'test ! -e web/node_modules && test ! -e web/src'

      - name: Runs as an unprivileged user
        run: test "$(docker run --rm ghcr.io/jajiz/coinpilot:ci-1 id -u)" = 10001

      - name: Imports the application and the scripts
        run: docker run --rm ghcr.io/jajiz/coinpilot:ci-1 python -c "import api.main, scripts.rotate_master_key"

      - name: shellcheck
        run: shellcheck deploy/*.sh

      - name: Deploy, deploy again, roll back
        run: |
          home="$RUNNER_TEMP/coinpilot"
          mkdir -p "$home"
          cp deploy/compose.yml deploy/compose.sh deploy/deploy.sh "$home/"
          # Throwaway values, generated here and gone with the runner.
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "CREDENTIAL_KEYS=1:$(openssl rand -base64 32)"
            echo "CREDENTIAL_KEY_VERSION=1"
            echo "GOOGLE_CLIENT_ID=ci"
            echo "GOOGLE_CLIENT_SECRET=ci"
            echo "GOOGLE_REDIRECT_URI=http://localhost:8000/api/auth/callback/google"
          } > "$home/.env"
          docker tag ghcr.io/jajiz/coinpilot:ci-1 ghcr.io/jajiz/coinpilot:ci-2

          "$home/deploy.sh" deploy ci-1
          curl -fsS http://127.0.0.1:8000/api/health
          # A deep link is the application, under the platform's CSP; an unknown API path is a 404.
          curl -fsS http://127.0.0.1:8000/settings | grep -q 'id="root"'
          curl -fsSI http://127.0.0.1:8000/ | grep -qi '^content-security-policy:'
          curl -sS http://127.0.0.1:8000/api/nothing -o /dev/null -w '%{http_code}' | grep -qx 404
          "$home/deploy.sh" deploy ci-2
          test "$(tail -n 1 "$home/releases")" = ci-2
          "$home/deploy.sh" rollback
          test "$(tail -n 1 "$home/releases")" = ci-1
          curl -fsS http://127.0.0.1:8000/api/health
          test "$(ls "$home"/backups/*.dump | wc -l)" = 2
          "$home/compose.sh" run --rm platform python scripts/rotate_master_key.py --check

          # A deploy that never became healthy leaves release.env ahead of releases. The
          # rollback must return to the last healthy release (ci-1), not the one before (ci-2).
          echo "TAG=never-healthy" > "$home/release.env"
          "$home/deploy.sh" rollback
          test "$(tail -n 1 "$home/releases")" = ci-1
          curl -fsS http://127.0.0.1:8000/api/health

      - name: The platform's log, when something failed
        if: failure()
        run: docker compose -p coinpilot logs --tail 200
