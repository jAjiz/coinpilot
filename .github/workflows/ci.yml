name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: coinpilot
          POSTGRES_PASSWORD: coinpilot
          POSTGRES_DB: coinpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coinpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://coinpilot:coinpilot@localhost:5432/coinpilot
      RUN_DB_INTEGRATION: "true"
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: Tests
        run: pytest tests --cov-fail-under=80
