[project]
name = "coinpilot"
version = "0.1.0"
description = "Multi-tenant portfolio rebalancer for Kraken"
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
target-version = "py313"
# Documents hold illustrative code and are a record; the formatter governs source only.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# The coverage gate lives in the CI command, not here. With core/db measured, anyone
# running only tests/unit would otherwise fail on code they deliberately skipped.
addopts = "-ra --strict-markers --cov --cov-report=term-missing"
markers = [
    "unit: Unit tests with no network and no database.",
    "integration: Tests that need a real PostgreSQL.",
]

[tool.coverage.run]
source = ["engine", "core", "exchange"]

[tool.coverage.report]
show_missing = true
